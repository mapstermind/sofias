{% if messages %}
  <ul class="mb-5 space-y-2" role="status">
    {% for message in messages %}
      <li class="rounded-xl border px-4 py-3 text-sm {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% else %}border-green-200 bg-green-50 text-green-800{% endif %}">{{ message }}</li>
    {% endfor %}
  </ul>
{% endif %}
