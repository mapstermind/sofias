{% extends "base_app.html" %}
{% load icons %}

{% block title %}¡Gracias! — {{ survey.title }}{% endblock %}


{% block content %}
<div class="flex justify-center">
  <div class="card w-full max-w-md p-8 text-center sm:p-10">

    <div class="mx-auto mb-6 flex size-12 items-center justify-center rounded-full bg-success-100">
      {% icon "check" "size-6 text-success-600" %}
    </div>

    <h1 class="text-xl font-bold text-neutral-900">¡Gracias!</h1>
    <p class="mt-3 text-base text-neutral-700">
      Tu respuesta a <span class="font-medium text-neutral-900">{{ survey.title }}</span> ha sido registrada.
    </p>

    <div class="mt-8 flex items-center justify-center">
      <a href="{% url 'core:home' %}"
        class="btn btn-primary">
        Ir al inicio
      </a>
    </div>

  </div>
</div>
{% endblock %}
