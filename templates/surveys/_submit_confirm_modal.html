{% load icons %}
<dialog id="submit-confirm-modal" class="dialog" aria-labelledby="submit-confirm-modal-title"{% if show_confirm %} data-open-on-load{% endif %}>
    <!-- Icon -->
    <div class="flex justify-center mb-4">
      <div class="rounded-full bg-warning-50 p-3">
        {% icon "exclamation-triangle" "size-7 text-warning-500" %}
      </div>
    </div>
    <h2 id="submit-confirm-modal-title" class="text-lg font-semibold text-neutral-900 text-center mb-2">¿Enviar tus respuestas?</h2>
    <p class="text-base text-neutral-600 text-center">
      Ya respondiste todas las preguntas. Al enviar, tus respuestas quedarán registradas y
      <span class="font-medium text-neutral-900">no podrás editarlas después</span>.
      Tus respuestas ya están guardadas, así que puedes revisarlas antes de enviar.
    </p>
    <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
      <button
        type="button" data-dialog-close
        class="btn btn-secondary">
        Seguir respondiendo
      </button>
      <button
        type="submit"
        form="survey-form"
        name="confirm"
        value="1"
        class="btn btn-primary">
        Enviar respuestas
      </button>
    </div>
</dialog>
