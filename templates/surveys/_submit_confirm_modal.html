<!-- Submit confirmation modal -->
<div id="submit-confirm-modal"
     class="fixed inset-0 z-50 items-center justify-center p-4"
     style="display:none">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black/40"></div>
  <!-- Dialog -->
  <div class="relative bg-white rounded-xl shadow-xl w-full max-w-md p-6 z-10">
    <!-- Icon -->
    <div class="flex justify-center mb-4">
      <div class="rounded-full bg-amber-50 p-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 3.75h.008M10.34 3.94 2.7 16.13c-.87 1.5.21 3.37 1.94 3.37h15.28c1.73 0 2.81-1.87 1.94-3.37L14.22 3.94c-.87-1.5-3.03-1.5-3.9 0Z" />
        </svg>
      </div>
    </div>
    <h2 class="text-lg font-semibold text-gray-900 text-center mb-2">¿Enviar tus respuestas?</h2>
    <p class="text-sm text-gray-600 text-center">
      Ya respondiste todas las preguntas. Al enviar, tus respuestas quedarán registradas y
      <span class="font-medium text-gray-900">no podrás editarlas después</span>.
      Tu progreso ya está guardado, así que puedes revisarlas antes de enviar.
    </p>
    <div class="mt-6 flex flex-col sm:flex-row gap-3">
      <button
        type="submit"
        form="survey-form"
        name="confirm"
        value="1"
        class="flex-1 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white text-center hover:bg-indigo-500 transition-colors">
        Enviar respuestas
      </button>
      <button
        type="button"
        onclick="document.getElementById('submit-confirm-modal').style.display='none'"
        class="flex-1 rounded-lg border border-gray-300 px-4 py-2.5 text-sm font-medium text-gray-700 text-center hover:bg-gray-50 transition-colors">
        Seguir editando
      </button>
    </div>
  </div>
</div>
