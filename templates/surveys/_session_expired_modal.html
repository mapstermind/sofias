{% load icons %}
<!-- Session expired modal -->
<div id="session-expired-modal"
     class="fixed inset-0 z-50 items-center justify-center p-4"
     style="display:none">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black/40"></div>
  <!-- Dialog -->
  <div class="relative bg-white rounded-xl shadow-xl w-full max-w-md p-6 z-10">
    <!-- Icon -->
    <div class="flex justify-center mb-4">
      <div class="rounded-full bg-warning-50 p-3">
        {% icon "exclamation-triangle" "size-7 text-warning-500" %}
      </div>
    </div>
    <h2 class="text-lg font-semibold text-neutral-900 text-center mb-2">Sesión expirada</h2>
    <p class="text-sm text-neutral-600 text-center">
      Tu sesión ha expirado por inactividad. Tu progreso guardado está a salvo — inicia sesión de nuevo para continuar.
    </p>
    <div class="mt-6">
      <a href="{% url 'accounts:request_otp' %}"
         class="btn btn-primary w-full">
        Iniciar sesión de nuevo
      </a>
    </div>
  </div>
</div>
