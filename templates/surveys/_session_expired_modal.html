{% load icons %}
<dialog id="session-expired-modal" class="dialog" aria-labelledby="session-expired-modal-title" data-dialog-static>
    <!-- Icon -->
    <div class="flex justify-center mb-4">
      <div class="rounded-full bg-warning-50 p-3">
        {% icon "exclamation-triangle" "size-7 text-warning-500" %}
      </div>
    </div>
    <h2 id="session-expired-modal-title" class="text-lg font-semibold text-neutral-900 text-center mb-2">Tu sesión se cerró</h2>
    <p class="text-base text-neutral-600 text-center">
      Se cerró por inactividad. Las respuestas que ya guardaste están a salvo; inicia sesión de nuevo para continuar.
    </p>
    <div class="mt-6">
      <a href="{% url 'accounts:request_otp' %}?next={{ request.get_full_path|urlencode }}"
         class="btn btn-primary w-full">
        Iniciar sesión de nuevo
      </a>
    </div>
</dialog>
