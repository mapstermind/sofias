{% load icons %}
<dialog id="instrucciones-modal" class="dialog max-w-lg" aria-labelledby="instrucciones-modal-title"{% if show_instructions %} data-open-on-load{% endif %}>
    <div class="flex items-start justify-between mb-4">
      <h2 id="instrucciones-modal-title" class="text-lg font-semibold text-neutral-900">Instrucciones</h2>
      <button type="button" aria-label="Cerrar" data-dialog-close
              class="btn btn-text btn-sm -mt-1 -mr-2 ml-4 shrink-0 px-2 text-neutral-500">
        {% icon "x-mark" "size-5" %}
      </button>
    </div>
    <div class="text-base text-neutral-600 space-y-3">
      {% include "surveys/_instrucciones_content.html" %}
    </div>
    <div class="mt-6 flex justify-end">
      <button type="button" data-dialog-close
              class="btn btn-primary">
        Entendido
      </button>
    </div>
</dialog>
