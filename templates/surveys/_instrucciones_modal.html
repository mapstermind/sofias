{% load icons %}
<!-- Instrucciones modal -->
<div id="instrucciones-modal"
     class="fixed inset-0 z-50 items-center justify-center p-4"
     style="display:none"
     onclick="if(event.target===this)this.style.display='none'">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black/40"></div>
  <!-- Dialog -->
  <div class="relative bg-white rounded-xl shadow-xl w-full max-w-lg p-6 z-10">
    <div class="flex items-start justify-between mb-4">
      <h2 class="text-lg font-semibold text-neutral-900">Instrucciones</h2>
      <button type="button" aria-label="Cerrar" onclick="document.getElementById('instrucciones-modal').style.display='none'"
              class="text-neutral-500 hover:text-neutral-600 transition-colors ml-4 shrink-0">
        {% icon "x-mark" "size-5" %}
      </button>
    </div>
    <div class="text-base text-neutral-600 space-y-3">
      {% include "surveys/_instrucciones_content.html" %}
    </div>
    <div class="mt-6 flex justify-end">
      <button onclick="document.getElementById('instrucciones-modal').style.display='none'"
              class="btn btn-primary">
        Entendido
      </button>
    </div>
  </div>
</div>
