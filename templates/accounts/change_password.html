{% extends "base_auth.html" %}

{% block title %}Cambia tu contraseña | {{ brand.name }}{% endblock %}

{% block form_header %}
  <h1 class="text-xl font-bold text-neutral-900">Cambia tu contraseña</h1>
  <p class="mt-2 text-sm text-neutral-600">
    Crea una contraseña nueva para continuar.
  </p>
{% endblock %}

{% block form_body %}
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="btn btn-primary btn-glow mt-8 w-full">Guardar contraseña</button>
  </form>
{% endblock %}
