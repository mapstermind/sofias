{% extends "base_centered.html" %}

{% block title %}Cambia tu contraseña | {{ brand.name }}{% endblock %}

{% block card_header %}
  <h1 class="text-2xl font-bold text-neutral-900">Cambia tu contraseña</h1>
  <p class="mt-2 text-sm text-neutral-500">
    Crea una contraseña nueva para continuar.
  </p>
{% endblock %}

{% block card_body %}
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="btn btn-primary mt-8 w-full">Guardar contraseña</button>
  </form>
{% endblock %}
