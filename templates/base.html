{% load static %}
<!DOCTYPE html>
<html lang="es" data-palette="{{ palette }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ brand.name }}{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static brand.logo %}">
  <link rel="preload" href="{% static 'fonts/figtree/Figtree-VariableFont_wght.ttf' %}" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
  <script src="{% static 'js/busy_submit.js' %}" defer></script>
  <script src="{% static 'js/dismiss.js' %}" defer></script>
</head>
<body class="{% block body_class %}min-h-screen bg-neutral-100{% endblock %} flex flex-col">
  {% block body %}{% endblock %}
  {% block palette_switch %}{% if show_palette_switch %}{% include "_palette_switch.html" %}{% endif %}{% endblock %}
</body>
</html>
