{% load l10n %}{% localize off %}
<figure class="m-0 w-full min-w-0">
  <div class="flex gap-1.5">
    {% if scale %}
      <div class="flex w-8 shrink-0 flex-col justify-between text-right text-[10px] leading-none text-neutral-500 tabular-nums" data-chart-scale aria-hidden="true">
        <span>100 %</span><span>50 %</span><span>0 %</span>
      </div>
    {% endif %}
    <svg class="block min-w-0 flex-1 overflow-visible {% if size == 'lg' %}h-40{% elif size == 'sm' %}h-18{% else %}h-28{% endif %}" role="img" aria-label="{{ aria_label }}">
      <line x1="0" x2="100%" y1="0" y2="0" class="stroke-neutral-200" stroke="#E5E7EB" stroke-width="1"></line>
      <line x1="0" x2="100%" y1="50%" y2="50%" class="stroke-neutral-200" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2 3"></line>
      {% for col in cols %}
        <rect x="{{ col.x }}%" y="100%" width="{{ col.width }}%" height="1" class="fill-neutral-300" fill="#D1D5DB"></rect>
        {% if col.value %}
          <rect x="{{ col.x }}%" y="{{ col.y }}%" width="{{ col.width }}%" height="{{ col.height }}%" rx="2" class="{{ col.fill }}" fill="{{ col.hex }}"></rect>
        {% endif %}
      {% endfor %}
    </svg>
  </div>
  <dl class="m-0 mt-1.5 grid text-center{% if scale %} ml-9.5{% endif %}" style="grid-template-columns: repeat({{ cols|length }}, minmax(0, 1fr))">
    {% for col in cols %}
      <div class="min-w-0">
        <dt class="flex items-center justify-center gap-1 text-[10px] leading-tight text-neutral-500">
          <span class="size-2.5 shrink-0 rounded-xs {{ col.swatch }}" aria-hidden="true"></span><span class="truncate">{{ col.label }}</span>
        </dt>
        <dd class="m-0 text-xs font-semibold tabular-nums {% if col.value %}text-neutral-900{% else %}text-neutral-500{% endif %}">{{ col.percent }} %</dd>
        <dd class="m-0 text-[10px] tabular-nums text-neutral-500">{{ col.value }}<span class="sr-only"> {{ col.unit }}</span></dd>
      </div>
    {% endfor %}
  </dl>
</figure>
{% endlocalize %}
