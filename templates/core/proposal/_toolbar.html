{% load icons %}
{% comment %}
The filter bar, with the proposed *Ver* selector beside the survey. Takes
`selected` (a categoría, or nothing for the final score). Not wired: a picture.
{% endcomment %}
<div class="flex flex-col gap-2 rounded-3xl bg-white p-3 md:flex-row md:items-center">
  <label class="min-w-0 md:flex-1">
    <span class="sr-only">Encuesta</span>
    <select class="control"><option>Guía III, marzo 2026</option></select>
  </label>
  <label class="flex min-w-0 items-center gap-2 md:flex-1">
    <span class="shrink-0 text-sm font-medium text-neutral-700">Ver</span>
    <select class="control">
      <option{% if not selected %} selected{% endif %}>Calificación final</option>
      {% for cat in categorias %}<option{% if cat.key == selected.key %} selected{% endif %}>{{ cat.label }}</option>{% endfor %}
    </select>
  </label>
  <button type="button" class="btn btn-secondary self-start md:self-auto">{% icon "funnel" %}Filtros</button>
</div>
<p class="mt-3 text-sm text-neutral-600">Toda la empresa: <span class="font-semibold text-neutral-900">{{ total }}</span> cuestionarios</p>
