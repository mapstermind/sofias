{% load icons %}
<div class="flex flex-wrap items-center gap-2">
  {% for pill in pills %}
    <a href="{{ pill.remove_url }}" data-results-link
       class="chip border-primary-200 bg-primary-50 text-primary-700 hover:bg-primary-100">
      {{ pill.label }} {% icon "x-mark" "size-4" %}<span class="sr-only">Quitar filtro</span>
    </a>
  {% endfor %}
</div>
<p data-group-line tabindex="-1" class="mt-2 text-sm text-neutral-600 focus:outline-none">
  {% for pill in pills %}{{ pill.label }}{% if not forloop.last %} · {% endif %}{% empty %}Toda la empresa{% endfor %}
  — <span class="font-semibold text-neutral-900">{{ results.size }}</span> cuestionario{{ results.size|pluralize }}
</p>
